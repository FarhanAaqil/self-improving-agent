task_id: custom_08_interval_merger
name: Merge Overlapping Intervals
prompt: 'Write a function `merge_intervals(intervals: list[tuple[int, int]]) -> list[tuple[int,
  int]]`

  that merges all overlapping intervals into sorted non-overlapping ranges.'
test: 'intervals = [(1, 3), (2, 6), (8, 10), (15, 18)]

  merged = merge_intervals(intervals)

  assert merged == [(1, 6), (8, 10), (15, 18)]

  assert merge_intervals([(1, 4), (4, 5)]) == [(1, 5)]

  assert merge_intervals([]) == []

  '
