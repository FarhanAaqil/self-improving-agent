<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Container with Sharp Corners -->
  <rect width="64" height="64" fill="#10241C"/>
  
  <!-- Outer Hexagonal Verification Shield Perimeter -->
  <path d="M32 5 L57 18 V46 L32 59 L7 46 V18 Z" stroke="#FF5A1F" stroke-width="2.5" stroke-linejoin="miter" fill="#142C23"/>
  
  <!-- Inner Verification Track (Cyan) -->
  <path d="M32 11 L51 21 V43 L32 53 L13 43 V21 Z" stroke="#0E7C86" stroke-width="1.5" stroke-dasharray="2 1" fill="none" opacity="0.8"/>
  
  <!-- Terminal Prompt Chevron & Loop '>_' -->
  <!-- Chevron '>' -->
  <path d="M21 24 L31 32 L21 40" stroke="#FF5A1F" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  
  <!-- Terminal Underscore '_' -->
  <line x1="33" y1="40" x2="43" y2="40" stroke="#FF5A1F" stroke-width="3" stroke-linecap="square"/>
  
  <!-- Recursive Ascending Improvement Arrow -->
  <path d="M26 32 C26 23 38 20 42 27 L44 23" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="square" fill="none"/>
  <polygon points="41,20 48,22 45,28" fill="#22D3EE"/>
</svg>