name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ── Unit tests & Sandbox Isolation (no external API key required) ──
  unit-tests:
    name: Unit & Sandbox tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        run: docker pull python:3.11-slim

      - name: Run sandbox isolation and unit tests
        run: pytest -m "not integration" -v

  # ── Smoke eval (requires GROQ_API_KEY + Docker) ─────────────
  smoke-eval:
    name: Smoke eval (8 HumanEval problems)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        run: docker pull python:3.11-slim

      - name: Run smoke eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || vars.GROQ_API_KEY }}
        run: python scripts/smoke_eval.py --problems 8

  # ── Full integration + eval (merge to main only) ─────────────
  integration:
    name: Full integration & Benchmark (merge to main)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        run: docker pull python:3.11-slim

      - name: Run integration test (1 real problem)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            pytest -m integration -v
          else
            echo "GROQ_API_KEY not set. Skipping real integration test."
          fi

      - name: Full eval run (50 HumanEval problems)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            python eval/humaneval_runner.py --problems 50
            python scripts/generate_readme_table.py
          else
            echo "GROQ_API_KEY not set. Skipping full benchmark eval."
          fi

      - name: Commit updated benchmark results
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        if: env.GROQ_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "update benchmark results [skip ci]" && git push)
