[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-agent"
version = "2.0.0"
description = "A sandboxed, benchmarked, self-repairing code generation agent"
requires-python = ">=3.11"

dependencies = [
    # LLM
    "groq>=0.11.0",

    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",

    # Vector memory (Chroma's bundled ONNX MiniLM embedder; no torch needed)
    "chromadb>=0.5.0",

    # Static analysis of generated code
    "bandit>=1.7.9",
    "radon>=6.0.1",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]
exclude = ["tests*", "scripts*", "results*", "sandbox*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["new plan"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702"]  # line length and compact inline idioms

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The verify_requirements argument:DeprecationWarning", "ignore:The verify_requirements argument:UserWarning"]
markers = [
    "integration: marks tests requiring real Groq API key and Docker (deselect with -m 'not integration')",
    "sandbox: marks adversarial sandbox isolation tests",
]

[tool.coverage.run]
source = ["app", "eval"]
# Attack scripts execute inside the Docker sandbox, never in the test process
omit = ["app/adversarial/*"]

[tool.coverage.report]
fail_under = 75
show_missing = false
skip_covered = true
