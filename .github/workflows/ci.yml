name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege by default; the benchmark job asks for write access on its own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ── Unit tests & Sandbox Isolation (no external API key required) ──
  unit-tests:
    name: Unit & Sandbox tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        run: docker pull python:3.11-slim

      - name: Run sandbox isolation and unit tests
        run: pytest -m "not integration" -v

  # ── Frontend: lint, type-check and production build ──
  frontend:
    name: Frontend (lint, test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  # ── Smoke eval (main only, needs GROQ_API_KEY secret + Docker) ──
  smoke-eval:
    name: Smoke eval (8 HumanEval problems)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      APP_ENV: development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        if: env.GROQ_API_KEY != ''
        run: docker pull python:3.11-slim

      - name: Run smoke eval
        if: env.GROQ_API_KEY != ''
        run: python scripts/smoke_eval.py --problems 8

      - name: Skip notice
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not configured; smoke eval skipped."

  # ── Full integration + eval (merge to main only) ─────────────
  integration:
    name: Full integration & Benchmark (merge to main)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      APP_ENV: development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        if: env.GROQ_API_KEY != ''
        run: docker pull python:3.11-slim

      - name: Run integration test (1 real problem)
        if: env.GROQ_API_KEY != ''
        run: pytest -m integration -v

      - name: Benchmark run (40 official HumanEval problems)
        if: env.GROQ_API_KEY != ''
        run: |
          python -m eval.benchmark --problems 40 --attempts 3
          python scripts/generate_readme_table.py

      - name: Commit updated benchmark results
        if: env.GROQ_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ README.md
          git diff --staged --quiet || (git commit -m "Benchmark results refreshed [skip ci]" && git push)

      - name: Skip notice
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not configured; integration and benchmark skipped."
