# docker-compose.yml
# ─────────────────────────────────────────────────────────────
# The API never touches the Docker socket directly. It talks to a socket proxy
# that only allows what sandbox runs need (create, attach, start, wait, kill,
# remove containers; inspect images; ping). Everything else (volumes, networks,
# exec, swarm, secrets, build, ...) is refused. The proxy sits on an internal
# network the published port can't reach.
#
# Sandbox containers themselves are started per execution by app/sandbox.py
# with no network, no capabilities, a pids limit and a read-only root.
#
# Remaining trust boundary (documented, not hidden): whoever can create
# containers on a host is close to root on it. For hostile multi-tenant use,
# run this on a dedicated VM or swap in gVisor / a microVM sandbox provider.

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      BUILD: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-control
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - docker-proxy
    ports:
      - "8000:8000"
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - APP_ENV=${APP_ENV:-development}
      - API_KEY=${API_KEY:-}
      - API_KEYS=${API_KEYS:-}
      - FAKE_LLM=${FAKE_LLM:-false}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DAILY_TOKEN_BUDGET=${DAILY_TOKEN_BUDGET:-0}
      - CERT_SIGNING_KEY=${CERT_SIGNING_KEY:-}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-FarhanAaqil/self-improving-agent}
    volumes:
      - agent_data:/data
    networks:
      - docker-control
      - default
    restart: unless-stopped

networks:
  docker-control:
    internal: true

volumes:
  agent_data:
