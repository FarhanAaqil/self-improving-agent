task_id: custom_01_lru_cache
name: Least Recently Used Cache
prompt: 'Implement a class `LRUCache` with methods `get(key: int) -> int` and `put(key:
  int, value: int) -> None`.

  If capacity is exceeded, evict the least recently used key. Return -1 if key not
  found.'
test: 'cache = LRUCache(2)

  cache.put(1, 1)

  cache.put(2, 2)

  assert cache.get(1) == 1

  cache.put(3, 3)

  assert cache.get(2) == -1

  cache.put(4, 4)

  assert cache.get(1) == -1

  assert cache.get(3) == 3

  assert cache.get(4) == 4

  '
