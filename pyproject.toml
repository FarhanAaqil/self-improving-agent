[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-agent"
version = "1.0.0"
description = "A sandboxed, benchmarked, self-repairing code generation agent"
requires-python = ">=3.11"

dependencies = [
    # LLM
    "groq>=0.11.0",

    # API layer (Day 4)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",

    # Vector memory
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]
exclude = ["tests*", "scripts*", "results*", "sandbox*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",    # for FastAPI TestClient
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "critique.py",
    "memory.py",
    "sandbox.py",
    "evaluate.py",
    "humaneval_problems.py",
    "config.py",
    "benchmark.py",
    "new plan",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702"]  # line length and compact inline idioms

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring real Groq API key and Docker (deselect with -m 'not integration')",
    "sandbox: marks adversarial sandbox isolation tests",
]
