# render.yaml
# ─────────────────────────────────────────────────────────────
# Render Web Service deployment configuration (DEMO).
#
# Render does not provide a Docker daemon, so the sandbox cannot run there.
# Code execution is therefore refused on this deployment rather than falling
# back to running model output on the host. Point SANDBOX at a machine with
# Docker (or a remote sandbox provider) to enable execution.
# ─────────────────────────────────────────────────────────────

services:
  - type: web
    name: self-improving-code-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: "production"
      - key: DEMO_MODE
        value: "true"
      - key: MODEL
        value: "qwen/qwen3.8-27b"
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: SANDBOX_TIMEOUT
        value: "10"
      - key: CRITIQUE_CONFIDENCE_THRESHOLD
        value: "0.3"
      - key: GITHUB_REPO
        value: "FarhanAaqil/self-improving-agent"
      - key: GITHUB_TOKEN
        sync: false
      # Never true on a public host: it would run untrusted code next to your secrets.
      - key: ALLOW_UNSAFE_HOST_SUBPROCESS
        value: "false"
      - key: ALLOW_CODE_OVERRIDE
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
