name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege by default; the benchmark job asks for write access on its own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ── Unit tests & Sandbox Isolation (no external API key required) ──
  unit-tests:
    name: Unit & Sandbox tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        run: docker pull python:3.11-slim

      - name: Run sandbox isolation and unit tests (coverage gate in pyproject)
        run: pytest -m "not integration" -v --cov --cov-report=term

  # ── Frontend: lint, type-check and production build ──
  frontend:
    name: Frontend (lint, test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  # ── End-to-end: real browser, real sandbox, scripted model ──
  e2e:
    name: End-to-end (Playwright)
    # Pinned: Playwright's browser installer lags behind new Ubuntu releases
    runs-on: ubuntu-24.04
    needs: [unit-tests, frontend]
    env:
      FAKE_LLM: "true"
      APP_ENV: development
      MEMORY_ENABLED: "false"
      RATE_LIMIT_PER_MINUTE: "0"
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend
        run: pip install -e .

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Pull sandbox docker image
        run: docker pull python:3.11-slim

      - name: Start the app
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat server.log; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
          retention-days: 7

  # ── Dependency audit (informational: new CVEs upstream shouldn't block unrelated PRs) ──
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Python packages (pip-audit)
        run: pip install pip-audit && pip install -e . && pip-audit --skip-editable || true

      - name: Frontend packages (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || true

  # ── Smoke eval (main only, needs GROQ_API_KEY secret + Docker) ──
  smoke-eval:
    name: Smoke eval (8 HumanEval problems)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      APP_ENV: development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        if: env.GROQ_API_KEY != ''
        run: docker pull python:3.11-slim

      - name: Run smoke eval
        if: env.GROQ_API_KEY != ''
        run: python scripts/smoke_eval.py --problems 8

      - name: Skip notice
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not configured; smoke eval skipped."

  # ── Full integration + eval (merge to main only) ─────────────
  integration:
    name: Full integration & Benchmark (merge to main)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      APP_ENV: development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: pip install -e ".[dev]"

      - name: Pull sandbox docker image
        if: env.GROQ_API_KEY != ''
        run: docker pull python:3.11-slim

      - name: Run integration test (1 real problem)
        if: env.GROQ_API_KEY != ''
        run: pytest -m integration -v

      - name: Benchmark run (40 official HumanEval problems)
        if: env.GROQ_API_KEY != ''
        run: |
          python -m eval.benchmark --problems 40 --attempts 3
          python scripts/generate_readme_table.py

      - name: Commit updated benchmark results
        if: env.GROQ_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ README.md
          git diff --staged --quiet || (git commit -m "Benchmark results refreshed [skip ci]" && git push)

      - name: Skip notice
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not configured; integration and benchmark skipped."
